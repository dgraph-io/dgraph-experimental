##
## Grafana Dashboard Provisioning
##
## Automatically loads dashboards from /var/lib/grafana/dashboards
##

apiVersion: 1

providers:
  - name: "Dgraph"
    orgId: 1
    folder: "Dgraph"
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
