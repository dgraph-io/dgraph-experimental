##
## Grafana Loki Configuration
##
## Receives logs from Promtail.
## Single-instance mode with local storage for development use.
##

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

ingester:
  # Large chunk age for dev setup — allows ingesting older Docker container logs
  # when Promtail replays log history on first start. The out-of-order acceptance
  # window is max_chunk_age / 2 (= 84h).
  max_chunk_age: 168h
  chunk_idle_period: 1h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  reject_old_samples: false
  unordered_writes: true
  max_query_length: 721h
  allow_structured_metadata: true
  volume_enabled: true

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
