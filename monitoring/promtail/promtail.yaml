##
## Promtail Configuration
##
## Collects Docker container logs via the Docker API and ships them to Loki.
## Uses Docker service discovery to automatically find containers.
##

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Keep only Dgraph containers (alpha and zero services)
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: (alpha|zero).*
        action: keep
      # Use container name as a label
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: container
      # Use the "service" container label
      - source_labels: [__meta_docker_container_label_service]
        target_label: service
      # Add compose service name
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      # Override service_name so each container gets its own Loki stream
      - source_labels: [__meta_docker_container_name]
        regex: /(.*)
        target_label: service_name
